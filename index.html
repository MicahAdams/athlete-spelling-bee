  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --bg2: #f7f7f5;
      --bg3: #efefec;
      --text: #1a1a1a;
      --text2: #6b6b6b;
      --text3: #a0a0a0;
      --border: rgba(0,0,0,0.10);
      --border2: rgba(0,0,0,0.18);
      --blue: #378ADD;
      --blue-light: #E6F1FB;
      --blue-dark: #185FA5;
      --green: #1D9E75;
      --green-light: #EAF3DE;
      --green-dark: #3B6D11;
      --red: #E24B4A;
      --red-light: #FCEBEB;
      --red-dark: #A32D2D;
      --amber-light: #FAEEDA;
      --amber-dark: #854F0B;
      --radius: 8px;
      --radius-lg: 12px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg2: #2c2c2e;
        --bg3: #3a3a3c;
        --text: #f2f2f7;
        --text2: #aeaeb2;
        --text3: #636366;
        --border: rgba(255,255,255,0.10);
        --border2: rgba(255,255,255,0.18);
        --blue-light: #0c2a47;
        --green-light: #0e2a1a;
        --red-light: #2a0e0e;
        --amber-light: #2a1e06;
      }
    }

    html, body {
      font-family: var(--font);
      background: var(--bg3);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      max-width: 430px;
      margin: 0 auto;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOP BAR */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .top-bar-left { display: flex; align-items: center; gap: 8px; }
    .top-bar-logo { font-size: 20px; }
    .top-bar-title { font-size: 15px; font-weight: 600; color: var(--text); }
    .avatar-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 0.5px solid var(--border2);
      background: var(--bg2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 13px; font-weight: 600;
      color: var(--text2); overflow: hidden; flex-shrink: 0;
    }
    .avatar-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

    /* TABS */
    .tab-bar {
      display: flex;
      border-bottom: 0.5px solid var(--border);
      background: var(--bg);
    }
    .tab {
      flex: 1; padding: 10px 4px; text-align: center;
      font-size: 13px; color: var(--text2); cursor: pointer;
      border-bottom: 2px solid transparent;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      transition: color 0.15s;
    }
    .tab.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 500; }
    .tab i { font-size: 14px; }

    /* SCREENS */
    .screen { padding: 16px; flex: 1; display: none; }
    .screen.visible { display: block; }

    /* GAME HEADER */
    .bee-header { text-align: center; padding: 6px 0 14px; }
    .bee-eyebrow { font-size: 11px; font-weight: 500; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
    .bee-date { font-size: 19px; font-weight: 600; color: var(--text); }

    /* PROGRESS DOTS */
    .prog-row { display: flex; justify-content: center; gap: 8px; margin: 10px 0 14px; }
    .dot {
      width: 11px; height: 11px; border-radius: 50%;
      background: var(--bg2); border: 0.5px solid var(--border2);
      transition: background 0.3s, border-color 0.3s;
    }
    .dot.done { background: var(--green); border-color: #0F6E56; }
    .dot.active { background: var(--blue); border-color: var(--blue-dark); }
    .dot.wrong { background: var(--red); border-color: var(--red-dark); }

    /* STAT CARDS */
    .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
    .stat-card { background: var(--bg2); border-radius: var(--radius); padding: 10px 12px; text-align: center; }
    .stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
    .stat-val { font-size: 24px; font-weight: 600; color: var(--text); }

    /* ATHLETE CARD */
    .athlete-card {
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      margin-bottom: 12px;
    }
    .athlete-img-wrap {
      position: relative;
      height: 230px;
      background: var(--bg2);
      overflow: hidden;
    }
    .athlete-img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
      display: block;
    }
    .img-loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; gap: 8px; color: var(--text3);
    }
    .img-loading i { font-size: 36px; }
    .img-loading span { font-size: 12px; }
    .sport-badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(255,255,255,0.92);
      border: 0.5px solid rgba(0,0,0,0.10);
      border-radius: var(--radius);
      padding: 4px 10px; font-size: 11px; font-weight: 500; color: #444;
    }
    .diff-badge {
      position: absolute; top: 10px; left: 10px;
      border-radius: var(--radius); padding: 4px 10px;
      font-size: 11px; font-weight: 600;
    }
    .diff-1, .diff-2 { background: rgba(234,243,222,0.95); color: #3B6D11; }
    .diff-3 { background: rgba(250,238,218,0.95); color: #854F0B; }
    .diff-4, .diff-5 { background: rgba(252,235,235,0.95); color: #A32D2D; }
    .wiki-credit {
      position: absolute; bottom: 6px; right: 8px;
      font-size: 10px; color: rgba(255,255,255,0.7);
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .athlete-body { padding: 12px 14px; }
    .athlete-clue { font-size: 14px; color: var(--text); line-height: 1.6; }

    /* PROMPT BUTTONS */
    .prompt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .prompt-btn {
      font-size: 12px; padding: 10px 6px;
      border-radius: var(--radius); background: var(--bg2);
      border: 0.5px solid var(--border); color: var(--text);
      cursor: pointer; text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      transition: background 0.15s;
    }
    .prompt-btn:hover { background: var(--bg3); }
    .prompt-btn.used { color: var(--text3); }
    .prompt-btn i { font-size: 14px; }

    .prompt-resp {
      background: var(--bg2); border-radius: var(--radius);
      padding: 10px 12px; margin-bottom: 12px;
      font-size: 13px; color: var(--text); line-height: 1.6;
      border-left: 2px solid var(--blue); display: none;
    }

    /* FEEDBACK */
    .feedback {
      text-align: center; padding: 10px 12px;
      border-radius: var(--radius); margin-bottom: 12px;
      font-size: 14px; font-weight: 500; display: none;
    }
    .feedback.correct { background: var(--green-light); color: var(--green-dark); }
    .feedback.wrong { background: var(--red-light); color: var(--red-dark); }

    /* INPUT */
    .spell-label { font-size: 13px; color: var(--text2); margin-bottom: 6px; }
    .spell-input {
      width: 100%; font-size: 22px; text-align: center;
      letter-spacing: .1em; padding: 13px;
      border-radius: var(--radius); border: 0.5px solid var(--border2);
      background: var(--bg); color: var(--text); margin-bottom: 10px;
      font-family: var(--font);
    }
    .spell-input:focus { outline: none; box-shadow: 0 0 0 2px rgba(55,138,221,0.3); border-color: var(--blue); }

    /* BUTTONS */
    .btn-primary {
      width: 100%; padding: 14px; font-size: 15px; font-weight: 500;
      border-radius: var(--radius); border: none;
      background: var(--blue); color: #fff;
      cursor: pointer; margin-bottom: 8px; font-family: var(--font);
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      width: 100%; padding: 12px; font-size: 14px;
      border-radius: var(--radius); border: 0.5px solid var(--border2);
      background: var(--bg); color: var(--text);
      cursor: pointer; margin-bottom: 8px; font-family: var(--font);
    }
    .btn-secondary:hover { background: var(--bg2); }
    .btn-muted {
      background: none; border: none; font-size: 12px;
      color: var(--text3); cursor: pointer; padding: 4px 0;
      display: block; width: 100%; text-align: center; font-family: var(--font);
    }
    .btn-muted:hover { color: var(--text2); }
    .btn-google {
      width: 100%; padding: 12px; font-size: 14px;
      border-radius: var(--radius); border: 0.5px solid var(--border2);
      background: var(--bg); color: var(--text);
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 10px; margin-bottom: 10px;
      font-family: var(--font);
    }
    .btn-google:hover { background: var(--bg2); }
    .google-logo { width: 18px; height: 18px; flex-shrink: 0; }

    /* LEADERBOARD & PROFILE */
    .card-section {
      background: var(--bg); border: 0.5px solid var(--border);
      border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px;
    }
    .section-title {
      font-size: 10px; font-weight: 600; color: var(--text3);
      text-transform: uppercase; letter-spacing: .07em; margin-bottom: 12px;
    }
    .lb-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; border-bottom: 0.5px solid var(--border);
    }
    .lb-row:last-child { border-bottom: none; }
    .lb-rank { font-size: 14px; font-weight: 500; color: var(--text2); width: 26px; text-align: center; }
    .lb-av {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue-light); display: flex; align-items: center;
      justify-content: center; font-size: 13px; font-weight: 600;
      color: var(--blue-dark); overflow: hidden; flex-shrink: 0;
    }
    .lb-av img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .lb-name { flex: 1; font-size: 14px; color: var(--text); }
    .lb-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
    .profile-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .profile-stat { background: var(--bg2); border-radius: var(--radius); padding: 10px; text-align: center; }
    .profile-stat-val { font-size: 24px; font-weight: 600; color: var(--text); }
    .profile-stat-label { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }

    /* MODAL */
    .modal-back {
      min-height: 260px; background: rgba(0,0,0,0.5);
      display: flex; align-items: center; justify-content: center;
      border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px;
    }
    .modal {
      background: var(--bg); border-radius: var(--radius-lg);
      padding: 24px 20px; width: 100%; max-width: 320px; text-align: center;
    }
    .modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
    .modal p { font-size: 14px; color: var(--text2); margin-bottom: 18px; line-height: 1.55; }

    /* RESULTS */
    .result-list {
      text-align: left; background: var(--bg2);
      border-radius: var(--radius); padding: 8px 12px; margin-bottom: 14px;
    }
    .result-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 0; border-bottom: 0.5px solid var(--border);
      font-size: 14px; color: var(--text);
    }
    .result-row:last-child { border-bottom: none; }

    /* GATE BANNER */
    .gate-banner {
      background: var(--blue-light); border-radius: var(--radius);
      padding: 12px; margin-bottom: 12px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .gate-banner i { color: var(--blue-dark); font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .gate-banner p { font-size: 13px; color: var(--blue-dark); line-height: 1.5; }

    /* LOADING */
    .loading-screen { text-align: center; padding: 3rem 1rem; }
    .spinner {
      width: 32px; height: 32px; border: 2px solid var(--border);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FINISHED */
    .finished-wrap { text-align: center; padding: 8px 0; }
    .fin-icon { font-size: 52px; margin-bottom: 12px; }
    .fin-score { font-size: 30px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .fin-msg { font-size: 14px; color: var(--text2); margin-bottom: 18px; }

    /* SAFE AREA for notched phones */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #app { padding-bottom: env(safe-area-inset-bottom); }
    }
  </style>
</head>

<div id="app">

  <div class="top-bar">
    <div class="top-bar-left">
      <span class="top-bar-logo">🐝</span>

      <i class="ti ti-user" style="font-size:16px" aria-hidden="true"></i>

  </div>

  <div class="tab-bar">

      <i class="ti ti-writing" aria-hidden="true"></i> Play
    </div>
    <div class="tab" id="tab-lb" onclick="switchTab('lb')">
      <i class="ti ti-trophy" aria-hidden="true"></i> Leaderboard
    </div>
    <div class="tab" id="tab-profile" onclick="switchTab('profile')">
      <i class="ti ti-chart-bar" aria-hidden="true"></i> My Stats

  <!-- PLAY SCREEN -->
  <div id="screen-play" class="screen visible">

      <div class="bee-date" id="date-label"></div>
    </div>
    <div class="prog-row" id="progress"></div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-label">Correct</div>
        <div class="stat-val" id="correct-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Streak</div>
        <div class="stat-val" id="streak-count">0</div>
      </div>
    </div>
    <div id="game-area"></div>
    <div id="finished-area" style="display:none"></div>
  </div>

  <!-- LEADERBOARD SCREEN -->
  <div id="screen-lb" class="screen">
    <div style="margin-bottom:16px">
      <div style="font-size:20px;font-weight:600;color:var(--text);margin-bottom:4px">Leaderboard</div>
      <div style="font-size:13px;color:var(--text2)">Top players — all-time total score</div>
    </div>
    <div class="card-section">
      <div id="lb-list"></div>
    </div>
  </div>

  <!-- PROFILE SCREEN -->
  <div id="screen-profile" class="screen">
    <div id="profile-content"></div>
  </div>

</div><!-- #app -->

/* ─── DATE HELPERS ─── */
function todayLabel() {
  return new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
function dateSeed() {
  const d = new Date();
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}
function seededShuffle(arr, seed) {
  const a = [...arr]; let s = seed;
  for (let i = a.length - 1; i > 0; i--) {
    s = (Math.imul(s, 1664525) + 1013904223) | 0;
    const j = Math.abs(s) % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* ─── WIKIPEDIA IMAGE FETCH ─── */
async function fetchWikiImage(wikiTitle) {
  try {
    const res = await fetch(WIKI_API(wikiTitle));
    const data = await res.json();
    const pages = data.query.pages;
    const page = pages[Object.keys(pages)[0]];
    return page.thumbnail ? page.thumbnail.source : null;
  } catch (e) {
    return null;
  }
}

/* ─── BUILD DAILY ROSTER ─── */
/* Shuffles all athletes by today's date seed, then picks the first 5 that
   return a Wikipedia photo. Same 5 athletes for everyone on the same day. */
async function buildDailyRoster() {
  const shuffled = seededShuffle(ROSTER, dateSeed());
  const confirmed = [];
  for (const athlete of shuffled) {
    if (confirmed.length >= 5) break;
    const imgUrl = await fetchWikiImage(athlete.wiki);
    if (imgUrl) confirmed.push({ ...athlete, imgUrl });
  }
  return confirmed;
}

function loadScores() {
  try {
    const raw = localStorage.getItem('bee_lb_v3');
    allScores = raw ? JSON.parse(raw) : [];
  } catch (e) { allScores = []; }
}
function saveScores() {
  try { localStorage.setItem('bee_lb_v3', JSON.stringify(allScores)); } catch (e) {}
}
async function recordScore(score, bestStreak) {
  if (!user) return;
  const idx = allScores.findIndex(s => s.uid === user.uid);
  if (idx >= 0) {
    allScores[idx].total += score;
    allScores[idx].bestStreak = Math.max(allScores[idx].bestStreak || 0, bestStreak);
    allScores[idx].gamesPlayed = (allScores[idx].gamesPlayed || 0) + 1;
    allScores[idx].name = user.name;
    if (user.photo) allScores[idx].photo = user.photo;
  } else {
    allScores.push({ uid: user.uid, name: user.name, photo: user.photo || null, total: score, bestStreak, gamesPlayed: 1 });
  }
  allScores.sort((a, b) => b.total - a.total);
  saveScores();
}

/* ─── PROMPT HELPERS ─── */
/* Replaces any occurrence of the athlete's last name (and full name) with [NAME]
   so hints never give away the spelling answer. Case-insensitive. */
function redact(text, athlete) {
  const escape = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  let out = text;
  // Redact full name first, then last name alone
  out = out.replace(new RegExp(escape(athlete.full), 'gi'), '[NAME]');
  out = out.replace(new RegExp(escape(athlete.last), 'gi'), '[NAME]');
  return out;
}
function showPrompt(type) {
  const a = todayAthletes[current];
  const r = document.getElementById('prompt-resp');
  const map = {
    sentence: { text: `"${redact(a.sentence, a)}"`, btn: 'pb-sentence' },
    origin: { text: redact(a.origin, a), btn: 'pb-origin' },
    context: { text: redact(a.context, a), btn: 'pb-context' }
  };
  const item = map[type]; if (!item) return;
  document.getElementById(item.btn).classList.add('used');
  r.textContent = item.text; r.style.display = 'block';
}

/* ─── GAME ACTIONS ─── */
function submitAnswer() {
  const a = todayAthletes[current];
  const val = (document.getElementById('spell-input').value || '').trim().toLowerCase();
  const fb = document.getElementById('feedback'); if (!val) return;
  const ok = val === a.last.toLowerCase();
  fb.textContent = ok ? `✓ Correct! ${a.full}` : `✗ The correct spelling is: ${a.last}`;
  fb.className = 'feedback ' + (ok ? 'correct' : 'wrong'); fb.style.display = 'block';
  if (ok) { correctCount++; streak++; } else { streak = 0; }
  results[current] = ok;
  document.getElementById('spell-input').disabled = true;
  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('correct-count').textContent = correctCount;
  document.getElementById('streak-count').textContent = streak;
  buildProgress();
}
function skipAthlete() {
  results[current] = false; streak = 0;
  const fb = document.getElementById('feedback');
  fb.textContent = `Skipped — the answer was: ${todayAthletes[current].last}`;
  fb.className = 'feedback wrong'; fb.style.display = 'block';
  document.getElementById('spell-input').disabled = true;
  document.getElementById('next-btn').style.display = 'block';
  document.getElementById('streak-count').textContent = streak;
  buildProgress();
}
function nextAthlete() { current++; loadAthleteRound(); }

  else if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => alert('Copied to clipboard!'));
  else alert(text);
}

  if (todayAthletes.length < 5) {
    document.getElementById('game-area').innerHTML = `
      <div style="text-align:center;padding:2.5rem;font-size:14px;color:var(--text2);line-height:1.6">
        Could not load today's athletes.<br>Please check your connection and refresh the page.
      </div>`;
    return;
  }
  loadAthleteRound();
}

init();
</script>
</body>
</html>
